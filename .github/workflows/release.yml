name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.0.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Validate build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npx vitest run --reporter=verbose

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --verbose

      - name: Verify Tauri build
        run: npx tauri build --no-bundle

  build-installers:
    name: Build ${{ matrix.name }} installers
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact-name: cvicubemx-windows-installers
            bundle-path: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - name: Ubuntu
            os: ubuntu-22.04
            artifact-name: cvicubemx-ubuntu-installers
            bundle-path: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Set app version from release tag
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          node -e "const fs = require('fs'); const version = process.env.RELEASE_VERSION.replace(/^v/, ''); for (const file of ['package.json', 'src-tauri/tauri.conf.json']) { const json = JSON.parse(fs.readFileSync(file, 'utf8')); json.version = version; fs.writeFileSync(file, JSON.stringify(json, null, 2) + '\n'); } const lockFile = 'package-lock.json'; if (fs.existsSync(lockFile)) { const lock = JSON.parse(fs.readFileSync(lockFile, 'utf8')); lock.version = version; if (lock.packages && lock.packages['']) lock.packages[''].version = version; fs.writeFileSync(lockFile, JSON.stringify(lock, null, 2) + '\n'); }"

      - name: Build Tauri installers
        run: npx tauri build

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.bundle-path }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-installers
    runs-on: ubuntu-latest
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: CviCubeMX ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: release-assets/**/*